name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Run tests
        run: npm ci && npm test
  build-publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: npm registry
      url: https://www.npmjs.com/package/@frontendnetwork/veganify
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: Update npm
        run: npm install --global npm@latest
      - name: Install dependencies & build
        run: npm ci && npm run build
      - name: Publish package on npm with provenance
        run: npm publish --access public --provenance --ignore-scripts
  verify-install:
    needs: build-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install dependencies
        run: npm ci
      - name: Verify package installation
        run: |
          PACKAGE_VERSION=$(npm view @frontendnetwork/veganify version)
          echo "Latest version of the package is: $PACKAGE_VERSION"
          npm install @frontendnetwork/veganify@$PACKAGE_VERSION
