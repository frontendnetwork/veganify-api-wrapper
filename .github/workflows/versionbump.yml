name: Version and publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip versioning')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Bump version and push tag
        id: bump_version
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          VERSION_TAG=$(npm version patch -m "feat(Version): Bump to %s [skip versioning]")
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm registry
      url: https://www.npmjs.com/package/@frontendnetwork/veganify
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Check out the version-bumped commit, not the pre-bump one
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies & build
        run: npm ci && npm run build

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance --ignore-scripts

      - name: Publish to GitHub Packages
        run: |
          npm config set registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GH_KEY }}
          npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_KEY }}

  verify-install:
    needs: build-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install dependencies
        run: npm ci

      - name: Verify package installation
        run: |
          PACKAGE_VERSION=$(npm view @frontendnetwork/veganify version)
          echo "Latest version of the package is: $PACKAGE_VERSION"
          npm install @frontendnetwork/veganify@$PACKAGE_VERSION
